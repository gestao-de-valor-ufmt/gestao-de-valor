<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materiais · Gestão de Valor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4">
      <div>
        <h1 class="h3 titulo-pagina">Materiais</h1>
        <p class="text-secondary mb-0">Materiais que você usa nos atendimentos e quanto custa cada uso.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-insumo">
        <i class="bi bi-plus-lg me-1"></i>Novo material
      </button>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr><th>Material</th><th>Embalagem</th><th class="text-end">Preço pago</th><th class="text-end">Rende</th><th class="text-end">Custo por uso</th><th></th></tr>
            </thead>
            <tbody id="tabela-insumos"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modal-insumo" tabindex="-1" aria-labelledby="titulo-modal-insumo" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-insumo">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-insumo">Novo material</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label class="form-label" for="insumo-nome">Nome</label>
            <input class="form-control" id="insumo-nome" required placeholder="Ex.: Esmalte">
          </div>
          <div class="col-12">
            <label class="form-label" for="insumo-embalagem">Embalagem</label>
            <input class="form-control" id="insumo-embalagem" placeholder="Ex.: Frasco 8 ml">
          </div>
          <div class="col-6">
            <label class="form-label" for="insumo-preco">Preço pago (R$)</label>
            <input class="form-control" id="insumo-preco" type="number" min="0" step="0.01" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="insumo-rendimento">Rende quantos usos?</label>
            <input class="form-control" id="insumo-rendimento" type="number" min="1" required>
          </div>
          <div class="col-12 small">Custo por uso: <strong id="insumo-resultado">—</strong></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary">Adicionar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/insumos.js"></script>
</body>
</html>
