<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajuda · Gestão de Valor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4 nao-imprimir">
      <div>
        <h1 class="h3 titulo-pagina">Ajuda</h1>
        <p class="text-secondary mb-0">Como usar o Gestão de Valor, passo a passo.</p>
      </div>
      <button class="btn btn-outline-primary" onclick="window.print()">
        <i class="bi bi-file-earmark-pdf me-1"></i>Baixar em PDF
      </button>
    </div>

    <div class="row g-4">
      <aside class="col-lg-3 nao-imprimir">
        <nav class="card sumario-ajuda" aria-label="Sumário do manual">
          <div class="card-body">
            <div class="small fw-semibold text-secondary text-uppercase mb-2">Nesta página</div>
            <ul class="list-unstyled mb-0 vstack gap-1" id="sumario"></ul>
          </div>
        </nav>
      </aside>
      <div class="col-lg-9">
        <article class="card">
          <div class="card-body p-4 p-lg-5 manual" id="manual">
            <p class="text-secondary">Carregando o manual…</p>
          </div>
        </article>
      </div>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ajuda.js"></script>
</body>
</html>
