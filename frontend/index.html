<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Gestão de Valor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container py-4">
    <h1 class="h3 titulo-pagina">Olá, <span id="nome-negocio"></span></h1>
    <p class="text-secondary mb-4">Resumo de custos e preços do seu negócio.</p>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="card indicador h-100"><div class="card-body">
          <div class="icone mb-2"><i class="bi bi-wallet2"></i></div>
          <div class="rotulo">Custo mensal</div>
          <div class="valor" id="ind-custo-mensal"></div>
          <div class="small text-secondary">custos fixos + pró-labore</div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card indicador h-100"><div class="card-body">
          <div class="icone mb-2"><i class="bi bi-clock-history"></i></div>
          <div class="rotulo">Hora técnica</div>
          <div class="valor" id="ind-custo-hora"></div>
          <div class="small text-secondary">quanto custa 1 hora sua</div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card indicador h-100"><div class="card-body">
          <div class="icone mb-2"><i class="bi bi-calendar-check"></i></div>
          <div class="rotulo">Horas produtivas</div>
          <div class="valor" id="ind-horas"></div>
          <div class="small text-secondary">por mês</div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card indicador h-100"><div class="card-body">
          <div class="icone mb-2"><i class="bi bi-card-checklist"></i></div>
          <div class="rotulo">Serviços</div>
          <div class="valor" id="ind-servicos"></div>
          <div class="small text-secondary">cadastrados</div>
        </div></div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h6 fw-semibold mb-3">Preços sugeridos <span class="small fw-normal text-secondary">(<span id="modo-calculo"></span>)</span></h2>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr><th>Serviço</th><th class="text-end">Custo</th><th class="text-end">Preço</th><th>Meta mínima no mês</th></tr>
                </thead>
                <tbody id="tabela-servicos"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
              <h2 class="h6 fw-semibold mb-0">Ponto de equilíbrio</h2>
              <select class="form-select form-select-sm w-auto" id="servico-grafico" aria-label="Serviço do gráfico"></select>
            </div>
            <p class="small text-secondary mb-2" id="texto-equilibrio"></p>
            <div class="flex-grow-1" style="min-height: 260px"><canvas id="grafico"></canvas></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/grafico.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
