<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Gestão de Valor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body class="pagina-login">
  <main class="container d-flex align-items-center justify-content-center py-5">
    <div class="card cartao-login w-100">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="h4 fw-bold mb-1" style="color: var(--cor-primaria)"><i class="bi bi-gem me-2"></i>Gestão de Valor</div>
          <p class="text-secondary small mb-0">Descubra quanto cobrar pelos seus serviços.</p>
        </div>

        <h1 class="h5 fw-semibold mb-3" id="titulo-formulario">Entrar</h1>

        <div class="alert alert-danger small py-2" id="erro" role="alert" hidden></div>
        <div class="alert alert-success small py-2" id="sucesso" role="status" hidden></div>

        <button type="button" class="btn btn-outline-secondary w-100 mb-3" id="entrar-google">
          <i class="bi bi-google me-2"></i>Continuar com Google
        </button>

        <div class="divisor-ou mb-3">ou</div>

        <form id="formulario" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" type="email" id="email" autocomplete="email" required>
          </div>
          <div class="mb-2">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" id="senha" autocomplete="current-password" minlength="6" required>
            <div class="form-text" id="ajuda-senha" hidden>Pelo menos 6 caracteres.</div>
          </div>
          <div class="text-end mb-3" id="area-esqueci">
            <button type="button" class="btn btn-link btn-sm p-0" id="esqueci">Esqueci minha senha</button>
          </div>
          <button class="btn btn-primary w-100" id="botao-enviar">Entrar</button>
        </form>

        <p class="text-center small mt-4 mb-0">
          <span id="pergunta-troca">Ainda não tem conta?</span>
          <button type="button" class="btn btn-link btn-sm p-0 align-baseline" id="trocar-modo">Criar conta grátis</button>
        </p>
        <p class="text-center small mt-2 mb-0">
          <a href="ajuda.html" class="link-secondary"><i class="bi bi-question-circle me-1"></i>Como funciona?</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
