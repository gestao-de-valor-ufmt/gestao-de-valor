<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços · Gestão de Valor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4">
      <div>
        <h1 class="h3 titulo-pagina">Serviços (ficha técnica)</h1>
        <p class="text-secondary mb-0">O seu "cardápio": o que cada serviço consome de material e de tempo.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-servico">
        <i class="bi bi-plus-lg me-1"></i>Novo serviço
      </button>
    </div>

    <div class="row g-3" id="lista-servicos"></div>
  </main>

  <div class="modal fade" id="modal-servico" tabindex="-1" aria-labelledby="titulo-modal-servico" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="form-servico">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-servico">Novo serviço</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label" for="servico-nome">Nome do serviço</label>
              <input class="form-control" id="servico-nome" required placeholder="Ex.: Spa dos pés">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="servico-minutos">Tempo (minutos)</label>
              <input class="form-control" id="servico-minutos" type="number" min="5" step="5" required>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="servico-miudos">Custos miúdos (R$)</label>
              <input class="form-control" id="servico-miudos" type="number" min="0" step="0.5" value="0">
            </div>
            <div class="col-12 form-text mt-1">
              Custos miúdos: gastos pequenos e difíceis de medir em cada atendimento, como gás, detergente
              ou combustível para buscar material.
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="form-label mb-0">Insumos usados</span>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="adicionar-linha">
              <i class="bi bi-plus-lg me-1"></i>Adicionar insumo
            </button>
          </div>
          <div id="linhas-insumos" class="vstack gap-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary">Salvar serviço</button>
        </div>
      </form>
    </div>
  </div>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/servicos.js"></script>
</body>
</html>
